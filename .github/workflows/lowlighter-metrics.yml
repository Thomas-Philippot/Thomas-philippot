name: Github Stats
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  github-stats:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
    - name: Edit profile stats
      uses: lowlighter/metrics@latest
      with:
        filename: metrics/metrics.classic.svg
        token: ${{ secrets.METRICS_TOKEN }}
        base: header, repositories
        plugin_lines: yes
    - name: Icons
      uses: lowlighter/metrics@latest
      with:
        filename: metrics/metrics.plugin.topics.icons.svg
        token: NOT_NEEDED
        base: ""
        plugin_topics: yes
        plugin_topics_limit: 0
        plugin_topics_mode: icons
    - name: Pinned repositories
      uses: lowlighter/metrics@latest
      with:
        filename: metrics/metrics.plugin.repositories.pinned.svg
        token: ${{ secrets.METRICS_TOKEN }}
        base: ""
        plugin_repositories: yes
        plugin_repositories_pinned: 2
    - name: Recent posts with descriptions and cover images
      uses: lowlighter/metrics@latest
      with:
        filename: metrics/metrics.plugin.posts.full.svg
        token: NOT_NEEDED
        base: ""
        plugin_posts: yes
        plugin_posts_user: thomas_ph35
        plugin_posts_source: dev.to
        plugin_posts_limit: 5
        plugin_posts_descriptions: yes
        plugin_posts_covers: yes

